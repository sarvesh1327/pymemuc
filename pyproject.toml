[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pymemuc"
dynamic = ["version"]
description = "A Python API for MEmu Android Emulator."
readme = "README.md"
authors = [{ name = "Martin Miglio", email = "martin@pyclashbot.app" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["memu", "memuc", "android-emulator", "api"]
dependencies = []

[project.urls]
Repository = "https://github.com/pyclashbot/pymemuc"
Documentation = "https://pymemuc.pyclashbot.app/"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = [".github", "docs", ".venv"]

[tool.hatch.build.targets.wheel]
packages = ["pymemuc"]

[dependency-groups]
dev = [
  "pre-commit>=4.0.0",
  "ipykernel>=6.29.0",
  "ruff>=0.9.0",
]
docs = [
  "sphinx>=8.0.0",
  "sphinxext-opengraph>=0.9.1",
  "sphinx-autobuild>=2024.10.0",
  "sphinx-copybutton>=0.5.2",
  "furo>=2024.8.6",
  "sphinx-intl>=2.3.0",
]
tests = [
  "twine>=6.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",
  "D213",
  "COM812",
  "ISC001",
  "FBT001",
  "FBT002",
  "FIX002",
  "TD002",
  "TD003",
  "PLC0415",
]
